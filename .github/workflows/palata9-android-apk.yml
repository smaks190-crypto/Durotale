name: Palata9 Godot Android APK

on:
  push:
    branches:
      - feature/palata9-native
    paths:
      - 'palata9/**'
      - '.github/workflows/palata9-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project structure
        run: python3 palata9/tests/validate_structure.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools cmdline-tools;latest platforms;android-35 build-tools;35.0.1'
      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Prepare debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" palata9/build
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Godot,C=US"
          JAVA_SDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_SDK_PATH"
          SETTINGS
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Godot scene and script import
        run: godot --headless --path palata9 --import
      - name: Gameplay smoke tests
        run: godot --headless --path palata9 --script res://tests/smoke_test.gd
      - name: Build Android ARM64 debug APK
        run: godot --headless --path palata9 --export-debug Android build/Palata9-debug.apk
      - name: Confirm generated APK
        run: test -s palata9/build/Palata9-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Palata9-Android-APK
          path: palata9/build/Palata9-debug.apk
          if-no-files-found: error
