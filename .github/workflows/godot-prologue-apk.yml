name: Corridor7 Godot Android APK

on:
  push:
    branches:
      - feature/godot-corridor7-android
    paths:
      - 'godot-prologue/**'
      - '.github/workflows/godot-prologue-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Godot prototype
        run: |
          mkdir -p godot-prologue
          tar -xJf godot-prologue/corridor7_sources.tar.xz -C godot-prologue
          python3 godot-prologue/tests/validate_structure.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools cmdline-tools;latest platforms;android-35 build-tools;35.0.1'
      - name: Install Godot 4.7.2 and templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Configure Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" godot-prologue/build
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Godot,C=US"
          JAVA_SDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_SDK_PATH"
          SETTINGS
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Godot import (syntax check)
        run: godot --headless --path godot-prologue --import
      - name: Test story and scene logic
        run: godot --headless --path godot-prologue --script res://tests/smoke_test.gd
      - name: Export ARM64 APK
        run: godot --headless --path godot-prologue --export-debug "Android" build/Corridor7-debug.apk
      - name: Confirm APK exists
        run: test -s godot-prologue/build/Corridor7-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Corridor7-Android-APK
          path: godot-prologue/build/Corridor7-debug.apk
          if-no-files-found: error
